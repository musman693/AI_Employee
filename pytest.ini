[pytest]
# Only look for tests in the top-level tests/ and module-specific test folders
testpaths = tests module1-email-whatsapp/tests module2-crm-sales/tests
python_paths = .
# Ignore nested copy (some environments have AI_Employee/AI_Employee)
norecursedirs = AI_Employee .venv venv env build dist

# Keep default python package discovery behavior
addopts = -q
